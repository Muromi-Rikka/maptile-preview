<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="1200" height="80">
  <defs>
    <linearGradient id="line3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0" />
    </linearGradient>
  </defs>

  <rect width="1200" height="80" fill="transparent"/>

  <!-- Stack icon left -->
  <g transform="translate(100, 40)" opacity="0.6">
    <rect x="-15" y="-15" width="30" height="8" rx="2" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="-15" y="-5" width="30" height="8" rx="2" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="-15" y="5" width="30" height="8" rx="2" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
  </g>

  <!-- Title -->
  <text x="600" y="48" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="600" letter-spacing="-0.5">
    Tech Stack
  </text>

  <!-- Decorative line -->
  <line x1="200" y1="65" x2="1000" y2="65" stroke="url(#line3)" stroke-width="1"/>

  <!-- Stack icon right -->
  <g transform="translate(1100, 40)" opacity="0.6">
    <rect x="-15" y="-15" width="30" height="8" rx="2" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
    <rect x="-15" y="-5" width="30" height="8" rx="2" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
    <rect x="-15" y="5" width="30" height="8" rx="2" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
  </g>
</svg>