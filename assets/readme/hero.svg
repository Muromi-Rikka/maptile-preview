<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.5"/>
    </pattern>
    <pattern id="grid-major" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#475569" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Grid layers -->
  <rect width="1200" height="400" fill="url(#grid)"/>
  <rect width="1200" height="400" fill="url(#grid-major)"/>

  <!-- Decorative coordinate markers -->
  <g fill="#3b82f6" opacity="0.6">
    <circle cx="200" cy="100" r="4"/>
    <circle cx="400" cy="200" r="4"/>
    <circle cx="600" cy="150" r="4"/>
    <circle cx="800" cy="250" r="4"/>
    <circle cx="1000" cy="180" r="4"/>
  </g>

  <!-- Connection lines -->
  <g stroke="#3b82f6" stroke-width="1" opacity="0.3">
    <line x1="200" y1="100" x2="400" y2="200"/>
    <line x1="400" y1="200" x2="600" y2="150"/>
    <line x1="600" y1="150" x2="800" y2="250"/>
    <line x1="800" y1="250" x2="1000" y2="180"/>
  </g>

  <!-- Tile grid visualization -->
  <g opacity="0.4">
    <rect x="100" y="60" width="60" height="60" rx="4" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4 2"/>
    <rect x="160" y="60" width="60" height="60" rx="4" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4 2"/>
    <rect x="100" y="120" width="60" height="60" rx="4" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4 2"/>
    <rect x="160" y="120" width="60" height="60" rx="4" fill="#06b6d4" fill-opacity="0.1" stroke="#06b6d4" stroke-width="1.5"/>
  </g>

  <!-- Right side tile stack -->
  <g opacity="0.5">
    <rect x="950" y="80" width="80" height="80" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <rect x="970" y="100" width="80" height="80" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <rect x="990" y="120" width="80" height="80" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1" stroke-dasharray="0"/>
    <!-- Map-like content in top tile -->
    <circle cx="990" cy="120" r="8" fill="none" stroke="#06b6d4" stroke-width="1"/>
    <line x1="970" y1="130" x2="1030" y2="130" stroke="#334155" stroke-width="0.5"/>
    <line x1="985" y1="110" x2="985" y2="150" stroke="#334155" stroke-width="0.5"/>
  </g>

  <!-- Coordinate labels -->
  <g fill="#64748b" font-family="ui-monospace, monospace" font-size="11">
    <text x="210" y="90">121.47°E</text>
    <text x="410" y="190">31.23°N</text>
    <text x="610" y="140">z=12</text>
  </g>

  <!-- Main title -->
  <g transform="translate(600, 220)">
    <text x="0" y="0" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="700" letter-spacing="-1">
      Maptile Preview
    </text>
    <text x="0" y="40" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
      Preview and compare map tile sources with ease
    </text>
  </g>

  <!-- Tech badges -->
  <g transform="translate(600, 310)">
    <g transform="translate(-220, 0)">
      <rect x="0" y="0" width="90" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="45" y="18" text-anchor="middle" fill="#3b82f6" font-family="ui-monospace, monospace" font-size="12">React 19</text>
    </g>
    <g transform="translate(-110, 0)">
      <rect x="0" y="0" width="90" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="45" y="18" text-anchor="middle" fill="#06b6d4" font-family="ui-monospace, monospace" font-size="12">MapLibre</text>
    </g>
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="100" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="50" y="18" text-anchor="middle" fill="#8b5cf6" font-family="ui-monospace, monospace" font-size="12">TypeScript</text>
    </g>
    <g transform="translate(120, 0)">
      <rect x="0" y="0" width="90" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="45" y="18" text-anchor="middle" fill="#0ea5e9" font-family="ui-monospace, monospace" font-size="12">Tailwind</text>
    </g>
  </g>
</svg>