<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="1200" height="80">
  <defs>
    <linearGradient id="line2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0" />
    </linearGradient>
  </defs>

  <rect width="1200" height="80" fill="transparent"/>

  <!-- Terminal icon left -->
  <g transform="translate(100, 40)" opacity="0.6">
    <rect x="-25" y="-12" width="50" height="24" rx="4" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <polyline points="-15,-4 -8,4 -15,12" fill="none" stroke="#10b981" stroke-width="2"/>
    <line x1="-5" y1="12" x2="10" y2="12" stroke="#10b981" stroke-width="1.5"/>
  </g>

  <!-- Title -->
  <text x="600" y="48" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="600" letter-spacing="-0.5">
    Quick Start
  </text>

  <!-- Decorative line -->
  <line x1="200" y1="65" x2="1000" y2="65" stroke="url(#line2)" stroke-width="1"/>

  <!-- Terminal icon right -->
  <g transform="translate(1100, 40)" opacity="0.6">
    <rect x="-25" y="-12" width="50" height="24" rx="4" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <polyline points="-15,-4 -8,4 -15,12" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <line x1="-5" y1="12" x2="10" y2="12" stroke="#3b82f6" stroke-width="1.5"/>
  </g>
</svg>